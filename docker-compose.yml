name: agent

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: Dockerfile
  image: agent-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  extra_hosts:
    - "host.docker.internal:host-gateway"   # alcança o Ollama que roda no host
  networks: [assist]

services:
  postgres:
    image: postgres:16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [assist]
    healthcheck:
      # CMD-SHELL: evita o bug de passar "-U assist -d assistdb" como UM argumento
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"   # só localhost: usado pelo host_runner
    volumes:
      - redisdata:/data
    networks: [assist]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-api:
    <<: *agent-common
    container_name: agent-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent-worker:
    <<: *agent-common
    container_name: agent-worker
    # -m worker.worker (módulo) => "app" fica importável; "python worker/worker.py" quebraria o import
    command: ["python", "-u", "-m", "worker.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.alive')<180 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Proxy minimo do Docker: o worker so cria/inicia/remove containers e le logs. Sem exec, sem volumes novos, sem imagens.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1        # leitura (inspect) da imagem do sandbox
      INFO: 1
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      SECRETS: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      SYSTEM: 0
      PLUGINS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [assist]

  kiln-worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.kiln_worker"]
    restart: unless-stopped
    user: "10001:10001"     # mesmo uid do sandbox: arquivos do volume ficam gravaveis pelos dois
    env_file: [.env]
    environment:
      HOME: /tmp
      DOCKER_HOST: tcp://docker-proxy:2375
      REDIS_URL: redis://redis:6379/0
      KILN_WORKSPACE_ROOT: /kiln/workspaces
      KILN_WORKSPACE_VOLUME: kiln_workspaces
      KILN_SANDBOX_IMAGE: kiln-sandbox:latest
      KILN_EGRESS_NETWORK: kiln_egress
      KILN_SCHEMA_PATH: /kiln/kiln.sql
      KILN_METRICS_PORT: "9108"
      KILN_MAX_PARALLEL: "2"
    volumes:
      - kiln_workspaces:/kiln/workspaces
      - ./db/kiln.sql:/kiln/kiln.sql:ro
#    depends_on: [postgres, redis, docker-proxy]
    expose: ["9108"]
    networks: [assist]
    mem_limit: 512m
                        
  agent-api:                                              # O agent-api passa a expor /kiln/*: so precisa das mesmas variaveis.
    environment:
      KILN_ADMIN_TOKEN: ${KILN_ADMIN_TOKEN:?defina KILN_ADMIN_TOKEN no .env}
      REDIS_URL: redis://redis:6379/0

volumes:
  kiln_workspaces:

networks:                                                 # (ver docs/kiln/RUNBOOK.md). Externa de proposito: nenhum servico do compose entra nela.                           
  kiln_egress:                                            # Egress controlada SOMENTE para instalar dependencias. Crie uma vez no host:
    external: true                                        # sudo docker network create kiln_egress
    name: kiln_egress                                     # e restrinja no firewall/proxy a registry.npmjs.org, pypi.org e files.pythonhosted.org
                                                                                          
networks: 
  assist:
    name: assist

volumes:
  pgdata:
  redisdata:
